name: Release

# Push a tag vX.Y.Z (matching __version__) to build, test and publish to
# PyPI. Publishing uses PyPI trusted publishing: no API token is stored
# anywhere, and PyPI records a signed attestation linking each file to
# this workflow run and commit.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Tag matches __version__
        run: |
          version=$(uv run --no-project python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('gedcom_privacy_guard/__init__.py').read())[1])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv build
      - name: Smoke-test the built wheel
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/gedcom-privacy-guard --version
          /tmp/smoke/bin/gedcom-privacy-guard scan sample_data/sample.ged --out /tmp/review.xlsx
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Add this environment on GitHub (Settings -> Environments) with
    # required reviewers, and name it in the PyPI trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/project/gedcom-privacy-guard/
    permissions:
      id-token: write # trusted publishing; nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GEDCOM Privacy Guard</title>
    <meta name="description" content="Check a family tree (GEDCOM) file for sensitive notes before you share it. Runs in your browser; your file is never uploaded." />
    <link rel="canonical" href="https://gedcomtools.com/" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#152a41" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GEDCOM Tools" />
    <meta property="og:title" content="GEDCOM Privacy Guard" />
    <meta property="og:description" content="Check a family tree (GEDCOM) file for sensitive notes before you share it. Runs in your browser; your file is never uploaded." />
    <meta property="og:url" content="https://gedcomtools.com/" />
    <meta property="og:image" content="https://gedcomtools.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The GEDCOM Privacy Guard orca crest, with the words: check your family tree file before you share it." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Data for search engines; not run as a script, so the CSP allows it. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "GEDCOM Privacy Guard",
        "url": "https://gedcomtools.com/",
        "description": "Checks a family tree (GEDCOM) file for sensitive notes, such as health, adoption and living people's details, before you share it. Runs in your browser; your file is never uploaded.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (web browser)",
        "browserRequirements": "Requires JavaScript and WebAssembly",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "image": "https://gedcomtools.com/og-image.png",
        "license": "https://github.com/VashonSoftware-com/gedcom-privacy-guard/blob/main/LICENSE",
        "sameAs": ["https://github.com/VashonSoftware-com/gedcom-privacy-guard", "https://pypi.org/project/gedcom-privacy-guard/"],
        "publisher": { "@type": "Organization", "name": "Vashon Software", "url": "https://vashonsoftware.com/" }
      }
    </script>
  </head>
  <body>
    <!-- Shown until the app starts (React replaces it), and to anything
         that reads the page without running JavaScript. -->
    <div id="root">
      <div class="page">
        <header>
          <img class="logo" src="/logo.webp" alt="" width="140" height="140" />
          <div>
            <h1>GEDCOM Privacy Guard</h1>
            <p class="tagline">
              Check your family tree file for sensitive notes before you upload or share it.
              <br />
              <strong>Your file never leaves this computer.</strong> Everything happens right here in your browser.
            </p>
            <noscript><p>This page needs JavaScript turned on to check a file.</p></noscript>
          </div>
        </header>
        <footer>
          <p class="footer-credit"><a href="/privacy/">Privacy</a> <a href="/what-it-can-do/">What it can and can't do</a></p>
        </footer>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

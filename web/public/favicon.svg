<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 20 164 164">
  <defs>
    <!-- The chest shield: Cornelisons.com's own drawing (free to use) of
         "Ermine, a chevron sable between three roundels gules", the arms
         crest sellers offer under the name. Not a claim to genuine arms. -->
    <clipPath id="shield">
      <path d="M6 4h52v26c0 16-11 25-26 30C17 55 6 46 6 30z"/>
    </clipPath>
    <g id="ermine" fill="#222">
      <circle cx="0" cy="-2.4" r=".45"/>
      <circle cx="-.7" cy="-1.8" r=".4"/>
      <circle cx=".7" cy="-1.8" r=".4"/>
      <path d="M0-1.7C.35-.5.55 1 .7 2.4L.3 2 0 2.7-.3 2-.7 2.4C-.55 1-.35-.5 0-1.7z"/>
    </g>
    <pattern id="ermines" x="28.5" y="0" width="7" height="12" patternUnits="userSpaceOnUse">
      <use href="#ermine" x="3.5" y="3"/>
      <use href="#ermine" x="0" y="9"/>
      <use href="#ermine" x="7" y="9"/>
    </pattern>
  </defs>
  <g stroke="#20221f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- body and legs -->
    <path d="M42 212c-8-50 10-90 58-92 48 2 66 42 58 92z" fill="#d9a66b"/>
    <path d="M70 212c-4-40 10-72 30-74 20 2 34 34 30 74z" fill="#f6efe3" stroke="none"/>
    <path d="M58 172c-4 14-4 28-2 40h30c0-12 0-24-2-36" fill="#d9a66b"/>
    <path d="M142 172c4 14 4 28 2 40h-30c0-12 0-24 2-36" fill="#d9a66b"/>
    <ellipse cx="71" cy="210" rx="20" ry="8" fill="#f6efe3"/>
    <ellipse cx="129" cy="210" rx="20" ry="8" fill="#f6efe3"/>
    <path d="M65 206v6M73 206v6M127 206v6M135 206v6" stroke-width="2.5"/>
    <!-- the family shield on the chest (64-unit drawing scaled to fit) -->
    <g transform="translate(72.9 142.6) scale(.846)">
      <g clip-path="url(#shield)" stroke="none">
        <rect width="64" height="64" fill="#fff"/>
        <rect width="64" height="64" fill="url(#ermines)" opacity=".4"/>
        <path d="M32 21L-2 55v14L32 35l34 34V55z" fill="#333"/>
        <circle cx="17" cy="16" r="7.5" fill="#d61f1f"/>
        <circle cx="47" cy="16" r="7.5" fill="#d61f1f"/>
        <circle cx="32" cy="47" r="7.5" fill="#d61f1f"/>
      </g>
      <path d="M6 4h52v26c0 16-11 25-26 30C17 55 6 46 6 30z" fill="none" stroke-width="3.5"/>
    </g>
    <!-- head: wide and flat -->
    <path d="M100 30c58 0 82 24 80 54-2 30-32 44-80 44s-78-14-80-44c-2-30 22-54 80-54z" fill="#d9a66b"/>
    <!-- folded rose ears -->
    <path d="M30 52c-4-18 18-26 34-16-12 0-22 6-26 18z" fill="#a8743f"/>
    <path d="M170 52c4-18-18-26-34-16 12 0 22 6 26 18z" fill="#a8743f"/>
    <path d="M92 33c4-2 12-2 16 0l4 38H88z" fill="#f6efe3" stroke="none"/>
    <path d="M70 46c8-5 16-5 22 0M108 46c6-5 14-5 22 0M80 54c4-2 8-2 12 0M108 54c4-2 8-2 12 0M96 60v8M104 60v8" fill="none" stroke-width="2.5"/>
    <!-- eyes -->
    <circle cx="66" cy="72" r="9" fill="#20221f"/>
    <circle cx="134" cy="72" r="9" fill="#20221f"/>
    <!-- underbite: the lower jaw sticks out past the jowls -->
    <path d="M70 104c4 22 56 22 60 0z" fill="#8f5a2e"/>
    <path d="M80 112c10 10 30 10 40 0" fill="#c76b6b" stroke="none"/>
    <!-- droopy jowls -->
    <path d="M100 86c-6 18-22 26-40 22-14-3-18-16-10-26 10-10 34-12 50 4z" fill="#f6efe3"/>
    <path d="M100 86c6 18 22 26 40 22 14-3 18-16 10-26-10-10-34-12-50 4z" fill="#f6efe3"/>
    <!-- teeth over the top lip -->
    <path d="M76 108l2-10 6 8zM124 108l-2-10-6 8z" fill="#fffdf8" stroke-width="2.5"/>
    <path d="M86 80c0-8 28-8 28 0 0 8-8 12-14 12s-14-4-14-12z" fill="#20221f"/>
  </g>
  <!-- highlights and blush -->
  <circle cx="63" cy="69" r="3" fill="#fff"/>
  <circle cx="131" cy="69" r="3" fill="#fff"/>
  <ellipse cx="94" cy="80" rx="4" ry="2" fill="#fff" opacity=".5"/>
  <ellipse cx="40" cy="96" rx="7" ry="4.5" fill="#e48c8c" opacity=".6"/>
  <ellipse cx="160" cy="96" rx="7" ry="4.5" fill="#e48c8c" opacity=".6"/>
  <path d="M70 96h.1M78 100h.1M84 94h.1M116 94h.1M122 100h.1M130 96h.1" stroke="#a8743f" stroke-width="3" stroke-linecap="round"/>
</svg>
